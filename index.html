<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gravity Switch</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!-- iOS 加到主畫面只認 PNG，不吃 SVG -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gravity Switch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: 'Orbitron', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif; color: #fff; }
  /* 中文與說明文字用一般字體，比較好讀 */
  .hint, #chDesc, .pNote, .pEmpty, .pItem, .achList li, .skin .nm, #toast, #quitFocus, .pGroup h3 span {
    font-family: 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif; }
  #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .coins { position: absolute; top: 1em; right: 1.1em; display: flex; align-items: center; gap: .3em;
    font-size: 1.45em; font-weight: 700; letter-spacing: .02em; text-shadow: 0 0 .4em rgba(0,0,0,.6); pointer-events: none; }
  .coins svg { width: 1.15em; height: 1.15em; }

  #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    background: linear-gradient(rgba(5,4,20,.35), rgba(5,4,20,.15) 40%, rgba(5,4,20,.45)); }
  .title { margin-top: 3.2em; font-size: 2.3em; font-weight: 900; letter-spacing: .04em; line-height: 1.15; text-align: center;
    text-shadow: 0 0 .35em rgba(255,255,255,.5), 0 0 1.2em rgba(190,90,255,.6); }
  .scores { display: flex; gap: 3em; margin-top: .6em; }
  .scores div { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .scores b { font-size: 3em; font-weight: 900; letter-spacing: .02em; }
  .scores span { font-size: 1.25em; margin-top: .15em; letter-spacing: .12em; opacity: .8; }
  #newBest { font-size: 1.1em; color: #ffe65a; height: 1.4em; margin-top: .3em; text-shadow: 0 0 .5em rgba(255,230,90,.6); }
  .play { margin-top: 1.2em; width: 8.6em; height: 8.6em; border-radius: 50%; border: .38em solid #fff;
    background: rgba(10,8,30,.45); box-shadow: 0 0 1.6em rgba(255,255,255,.55), inset 0 0 1.2em rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center; transition: transform .12s; }
  .play:active { transform: scale(.94); }
  .play svg { width: 4.4em; height: 4.4em; margin-left: .5em; }
  .row { display: flex; gap: 2.4em; margin-top: 1.4em; }
  .round { position: relative; width: 5em; height: 5em; border-radius: 50%; border: .2em solid #fff;
    background: rgba(10,8,30,.45); box-shadow: 0 0 .8em rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; }
  .round svg { width: 2.6em; height: 2.6em; }
  .badge { position: absolute; bottom: -.9em; left: 50%; transform: translateX(-50%); background: #fff; color: #111;
    border-radius: 1em; padding: .1em .55em; font-size: 1em; font-weight: 700; white-space: nowrap; }
  .challenge { position: absolute; bottom: 0; left: 0; right: 0; padding: 1.4em 1em 2.2em; text-align: center;
    border-top: 1px solid rgba(255,255,255,.25); background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.55)); }
  .chTitle { font-size: 1.6em; font-weight: 700; letter-spacing: .06em; }
  .chTitle small { font-size: .62em; font-weight: 500; }
  .chTitle small i { font-style: normal; opacity: .5; }
  #chDesc { font-size: 1.25em; margin-top: .2em; }
  .hint { position: absolute; bottom: 9.6em; font-size: 1.05em; opacity: .75; }

  .panel { position: absolute; inset: 1.2em; border-radius: 1.2em; background: rgba(12,9,34,.96);
    border: .12em solid rgba(255,255,255,.3); box-shadow: 0 0 2em rgba(0,0,0,.6); display: flex; flex-direction: column; }
  .panelHead { display: flex; align-items: center; justify-content: space-between; padding: 1em 1.2em .6em; }
  .panelHead h2 { margin: 0; font-size: 1.6em; font-weight: 900; letter-spacing: .08em; }
  .close { width: 2.4em; height: 2.4em; border-radius: 50%; border: .15em solid #fff; font-size: 1.1em; line-height: 1; }
  .panelBody { overflow-y: auto; padding: .4em 1.2em 1.2em; flex: 1; }
  .shopGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8em; }
  .skin { display: flex; flex-direction: column; align-items: center; padding: .7em .3em .6em; border-radius: .8em;
    background: rgba(255,255,255,.06); border: .12em solid transparent; }
  .skin.sel { border-color: #fff; background: rgba(255,255,255,.14); }
  .skin canvas { width: 4.6em; height: 4.6em; }
  .skin .nm { font-size: 1.05em; margin-top: .2em; }
  .skin .pr { margin-top: .35em; font-size: .95em; font-weight: 700; display: flex; align-items: center; gap: .25em;
    padding: .2em .7em; border-radius: 1em; background: #fff; color: #111; }
  .skin .pr svg { width: 1em; height: 1em; }
  .skin .pr.no { background: rgba(255,255,255,.25); color: #fff; }
  .achList { list-style: none; margin: 0; padding: 0; }
  .achList li { display: flex; align-items: center; gap: .8em; padding: .65em .2em; border-bottom: 1px solid rgba(255,255,255,.1); font-size: 1.05em; }
  .achList .st { width: 1.8em; height: 1.8em; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    border: .12em solid rgba(255,255,255,.35); font-size: .9em; }
  .achList li.done .st { background: #fff; color: #111; border-color: #fff; }
  .achList li.cur { background: rgba(255,255,255,.08); border-radius: .5em; }
  .achList li.cur .st { border-color: #ffe65a; color: #ffe65a; }
  .achList li.lock { opacity: .45; }
  .achList .rw { margin-left: auto; font-weight: 700; display: flex; align-items: center; gap: .2em; white-space: nowrap; }
  .achList .rw svg { width: 1em; height: 1em; }

  #btnMute { position: absolute; top: 3.1em; right: 1.1em; z-index: 5; width: 2.2em; height: 2.2em; border-radius: 50%;
    border: .1em solid rgba(255,255,255,.45); background: rgba(10,8,30,.5); font-size: 1.1em; line-height: 1; opacity: .8; }
  #btnMute:hover { opacity: 1; }
  #quitFocus { position: absolute; top: 2.6em; left: 1em; z-index: 5; font-size: 1em; padding: .35em .8em;
    border-radius: 1.2em; border: .1em solid rgba(255,255,255,.6); background: rgba(10,8,30,.7); }
  .pNote { font-size: 1.05em; opacity: .8; margin-bottom: .8em; line-height: 1.5; }
  .pGroup { margin-bottom: .9em; }
  .pGroup h3 { margin: 0 0 .35em; font-size: 1.2em; display: flex; align-items: center; gap: .5em; }
  .pGroup h3 span { font-size: .8em; font-weight: 500; opacity: .55; }
  .pItem { display: flex; align-items: center; gap: .6em; width: 100%; text-align: left; padding: .55em .8em;
    border-radius: .6em; background: rgba(255,255,255,.07); margin-bottom: .35em; font-size: 1.05em; }
  .pItem:hover { background: rgba(255,255,255,.16); }
  .pItem .mi { margin-left: auto; font-size: .85em; opacity: .55; white-space: nowrap; }
  .pEmpty { opacity: .5; font-size: 1em; padding: .3em 0 .6em; }

  /* 結算時彈出的貓咪 */
  #catPop { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center;
    background: rgba(4,3,16,.82); animation: catIn .28s ease-out; }
  @keyframes catIn { from { opacity: 0; } to { opacity: 1; } }
  .catCard { width: 82%; max-height: 80%; display: flex; flex-direction: column; align-items: center;
    padding: 1em; border-radius: 1.2em; background: rgba(16,12,40,.95);
    border: .14em solid rgba(255,255,255,.45); box-shadow: 0 0 2.4em rgba(0,0,0,.7);
    animation: catPopIn .32s cubic-bezier(.2,1.5,.5,1); }
  @keyframes catPopIn { from { transform: scale(.6); } to { transform: scale(1); } }
  .catCard img { width: 100%; max-height: 22em; object-fit: contain; border-radius: .7em; background: #000; }
  .catTitle { font-size: 1.9em; font-weight: 900; letter-spacing: .04em; margin-top: .5em; text-align: center; }
  .catTitle.win { color: #ffe65a; text-shadow: 0 0 .6em rgba(255,230,90,.7); }
  .catTitle.lose { color: #9fb4ff; }
  .catSub { font-family: 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif;
    font-size: 1.05em; opacity: .75; margin-top: .25em; text-align: center; }

  #toast { position: absolute; left: 50%; top: 9.5em; transform: translate(-50%, -.6em); opacity: 0; pointer-events: none;
    background: rgba(255,255,255,.95); color: #111; padding: .55em 1.1em; border-radius: 2em; font-size: 1.1em; font-weight: 700;
    white-space: nowrap; transition: opacity .25s, transform .25s; box-shadow: 0 0 1.2em rgba(255,255,255,.4); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="coins"><span id="coinTxt">0</span><svg viewBox="0 0 20 20"><path d="M10 1l8 4-8 4-8-4z" fill="#fff46e"/><path d="M2 5l8 4v10l-8-4z" fill="#e3c800"/><path d="M18 5l-8 4v10l8-4z" fill="#b39a00"/></svg></div>

  <div id="menu">
    <div class="title">gravity switch</div>
    <div class="scores">
      <div><b id="mScore">0</b><span>score</span></div>
      <div><b id="mBest">0</b><span>best</span></div>
    </div>
    <div id="newBest"></div>
    <button id="play" class="play" aria-label="play"><svg viewBox="0 0 24 24"><path d="M6 3.5l15 8.5-15 8.5z" fill="#fff"/></svg></button>
    <div class="row">
      <button id="btnShop" class="round" aria-label="shop"><svg viewBox="0 0 24 24"><path d="M12 2.5l8.5 4.7v9.6L12 21.5l-8.5-4.7V7.2z M3.5 7.2L12 12l8.5-4.8 M12 12v9.5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
      <button id="btnPractice" class="round" aria-label="practice" title="練習單一關卡（不計分）"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="1.4" fill="#fff"/></svg></button>
      <button id="btnAch" class="round" aria-label="challenges"><svg viewBox="0 0 24 24"><path d="M7 3h10v5a5 5 0 01-10 0z M12 13v4 M8 21h8v-2.5H8z" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><path d="M7 5H4.2a3.2 3.2 0 003.3 4.2 M17 5h2.8a3.2 3.2 0 01-3.3 4.2" fill="none" stroke="#fff" stroke-width="1.6"/></svg><span class="badge" id="achPct">0%</span></button>
    </div>
    <div class="hint">點擊螢幕 / 空白鍵 切換重力</div>
    <div class="challenge">
      <div class="chTitle">challenge <small><span id="chNum">1</span><i>/<span id="chTotal">20</span></i></small></div>
      <div id="chDesc"></div>
    </div>
  </div>

  <div id="shop" class="panel hidden">
    <div class="panelHead"><h2>skins</h2><button class="close" data-close>✕</button></div>
    <div class="panelBody"><div class="shopGrid" id="shopGrid"></div></div>
  </div>

  <button id="quitFocus" class="hidden">✕ 離開練習</button>
  <button id="btnMute" title="音效開關（M）"></button>

  <div id="practice" class="panel hidden">
    <div class="panelHead"><h2>practice</h2><button class="close" data-close>✕</button></div>
    <div class="panelBody">
      <div class="pNote">選一關重複練習。<b>不計分、不影響最佳紀錄</b>，死亡後自動重來。按 Esc 或左上角按鈕離開。</div>
      <div id="practiceList"></div>
    </div>
  </div>

  <div id="ach" class="panel hidden">
    <div class="panelHead"><h2>challenges</h2><button class="close" data-close>✕</button></div>
    <div class="panelBody"><ul class="achList" id="achList"></ul></div>
  </div>

  <div id="catPop" class="hidden">
    <div class="catCard">
      <img id="catImg" alt="">
      <div class="catTitle" id="catTitle"></div>
      <div class="catSub" id="catSub"></div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="core.js"></script>
<script src="levels.js"></script>
<script src="cats.js"></script>
<script src="audio.js"></script>
<script>
'use strict';

// ============================================================
//  存檔、造型、挑戰
// ============================================================
const SAVE_KEY = 'gravitySwitchSave_v1';
function loadSave() {
  const def = { best: 0, coins: 0, owned: ['classic'], skin: 'classic', ch: 0, games: 0, coinsTotal: 0, distTotal: 0 };
  try { return Object.assign(def, JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { return def; }
}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const save = loadSave();

const SKINS = [
  { id: 'classic', name: '經典紅', price: 0,   body: '#e8231f', accent: '#ffb02e', trail: '#ff7a1a' },
  { id: 'ice',     name: '冰晶',   price: 40,  body: '#27b7f5', accent: '#e8fbff', trail: '#6fe3ff' },
  { id: 'lime',    name: '萊姆',   price: 60,  body: '#6fcf1d', accent: '#f4ff9a', trail: '#b8ff4a' },
  { id: 'violet',  name: '紫晶',   price: 90,  body: '#8e3cf0', accent: '#ffc7ff', trail: '#d27bff' },
  { id: 'gold',    name: '黃金',   price: 150, body: '#f0b400', accent: '#fff3b0', trail: '#ffd84a' },
  { id: 'mint',    name: '薄荷',   price: 200, body: '#1fd6a3', accent: '#e0fff5', trail: '#6affd2' },
  { id: 'white',   name: '白金',   price: 260, body: '#dfe6f0', accent: '#6fd0ff', trail: '#bfe8ff' },
  { id: 'shadow',  name: '黑曜',   price: 320, body: '#2c2644', accent: '#ff2e88', trail: '#ff2e88' },
  { id: 'pink',    name: '霓虹粉', price: 400, body: '#ff2fa8', accent: '#ffffff', trail: '#ff7bd0' },
  { id: 'rainbow', name: '彩虹',   price: 600, rainbow: true, accent: '#ffffff' },
];

const CHALLENGES = [
  { t: 'score', n: 10, r: 10 },      { t: 'coinsRun', n: 3, r: 10 },   { t: 'games', n: 5, r: 15 },
  { t: 'score', n: 25, r: 15 },      { t: 'flipsRun', n: 30, r: 15 },  { t: 'coinsTotal', n: 30, r: 20 },
  { t: 'score', n: 40, r: 20 },      { t: 'diff', n: 3, r: 20 },       { t: 'coinsRun', n: 8, r: 25 },
  { t: 'score', n: 60, r: 25 },      { t: 'games', n: 20, r: 25 },     { t: 'flipsRun', n: 80, r: 30 },
  { t: 'distTotal', n: 1000, r: 30 },{ t: 'score', n: 90, r: 35 },     { t: 'diff', n: 4, r: 35 },
  { t: 'coinsRun', n: 15, r: 40 },   { t: 'score', n: 130, r: 40 },    { t: 'diff', n: 5, r: 50 },
  { t: 'score', n: 180, r: 60 },     { t: 'score', n: 250, r: 100 },
];
const CUMULATIVE = { games: 1, coinsTotal: 1, distTotal: 1 };
function chDesc(c) {
  return {
    score: `單局達到 ${c.n} 分`, coinsRun: `單局收集 ${c.n} 個黃色方塊`, games: `累積遊玩 ${c.n} 局`,
    flipsRun: `單局切換重力 ${c.n} 次`, coinsTotal: `累積收集 ${c.n} 個黃色方塊`, diff: `到達難度 ${c.n} 的關卡`,
    distTotal: `累積獲得 ${c.n} 分`,
  }[c.t];
}
function chProgress(c, ended) {
  const r = run || { score: 0, coins: 0, flips: 0, maxD: 0 };
  switch (c.t) {
    case 'score': return r.score;
    case 'coinsRun': return r.coins;
    case 'flipsRun': return r.flips;
    case 'diff': return r.maxD;
    case 'games': return save.games;
    case 'coinsTotal': return save.coinsTotal + (ended ? 0 : r.coins);
    case 'distTotal': return save.distTotal + (ended ? 0 : r.score);
  }
  return 0;
}
function checkChallenges(ended) {
  const done = [];
  while (save.ch < CHALLENGES.length) {
    const c = CHALLENGES[save.ch];
    if (chProgress(c, ended) < c.n) break;
    save.coins += c.r; save.ch++; done.push(c);
  }
  if (done.length) {
    persist();
    toast(done.length === 1 ? `✓ ${chDesc(done[0])}  +${done[0].r}` : `✓ 完成 ${done.length} 個挑戰  +${done.reduce((a, c) => a + c.r, 0)}`);
  }
}

// ============================================================
//  畫面
// ============================================================
const W = 450, H = 800, CELL = H / ROWS;
const VPX = W * 0.68, VPY = H * 0.44, DEPTH = 0.16;   // 透視消失點與厚度
const RUN_START_X = 4, CAM_OFFSET = 2.6;
const COIN_PAL = { front: '#ffe600', top: '#fff79a', bottom: '#d9c200', side: '#b39a00' };

const THEMES = [
  ['#8a1fd6', '#b01ed8', '#9d1cd9', '#c42bd9', '#7d22cf'],
  ['#1b9fd0', '#1ec3d2', '#1789c4', '#22b0d8', '#19a5c0'],
  ['#7a2be2', '#1e90ff', '#78c800', '#ffc400', '#ff8a00', '#e3261e', '#ff2aa0'],
  ['#1f8a5c', '#5a8f23', '#c9a21a', '#e08a00', '#d6441c', '#c21f2a', '#178a7a'],
];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const $ = id => document.getElementById(id);

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  wrap.style.width = W * s + 'px'; wrap.style.height = H * s + 'px';
  wrap.style.fontSize = 16 * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

const palCache = new Map();
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(c, a) { const t = a < 0 ? 0 : 255, p = Math.abs(a); return `rgb(${c.map(v => Math.round(v + (t - v) * p)).join(',')})`; }
function pal(hex) {
  let p = palCache.get(hex);
  if (!p) { const c = hexRgb(hex); p = { front: hex, top: mix(c, .3), bottom: mix(c, -.15), side: mix(c, -.4) }; palCache.set(hex, p); }
  return p;
}
function hslPal(h) { return { front: `hsl(${h},85%,52%)`, top: `hsl(${h},90%,70%)`, bottom: `hsl(${h},80%,42%)`, side: `hsl(${h},80%,32%)` }; }
function skinPal(s, t) { return s.rainbow ? hslPal((t * 90) % 360) : pal(s.body); }
function curSkin() { return SKINS.find(s => s.id === save.skin) || SKINS[0]; }

function themeFor(c) { return THEMES[Math.floor(Math.max(0, c - RUN_START_X) / CONFIG.COLS_PER_POINT / CONFIG.THEME_POINTS) % THEMES.length]; }
// 一整欄（含懸浮方塊）共用同一個顏色
function colorFor(c) {
  const t = themeFor(c);
  return pal(t[((c % t.length) + t.length) % t.length]);
}

function quad(g, a, b, c, d, e, f, h, i, fill) {
  g.fillStyle = fill; g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.lineTo(e, f); g.lineTo(h, i); g.closePath(); g.fill();
}
function drawSides(g, b, vx, vy) {
  const m = 1 - (b.k || DEPTH);   // 小方塊的厚度按比例縮小
  const bx0 = vx + (b.x0 - vx) * m, bx1 = vx + (b.x1 - vx) * m, by0 = vy + (b.y0 - vy) * m, by1 = vy + (b.y1 - vy) * m;
  if (b.y0 > vy) quad(g, b.x0, b.y0, b.x1, b.y0, bx1, by0, bx0, by0, b.pal.top);
  if (b.y1 < vy) quad(g, b.x0, b.y1, b.x1, b.y1, bx1, by1, bx0, by1, b.pal.bottom);
  if (b.x1 < vx) quad(g, b.x1, b.y0, b.x1, b.y1, bx1, by1, bx1, by0, b.pal.side);
  if (b.x0 > vx) quad(g, b.x0, b.y0, b.x0, b.y1, bx0, by1, bx0, by0, b.pal.side);
}
function drawFront(g, b) {
  if (b.glow) { g.shadowColor = b.glow; g.shadowBlur = 14; }
  g.fillStyle = b.pal.front; g.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0);
  if (b.glow) g.shadowBlur = 0;
  if (b.player) {   // 玩家方塊正面細節：左側發光窗 + 右側條紋
    const w = b.x1 - b.x0, h = b.y1 - b.y0;
    g.fillStyle = 'rgba(255,255,255,.92)';
    g.fillRect(b.x0 + w * .1, b.y0 + h * .28, w * .22, h * .44);
    g.fillStyle = b.player.accent;
    for (let i = 0; i < 4; i++) g.fillRect(b.x0 + w * .5, b.y0 + h * (.2 + i * .17), w * .38, h * .08);
  }
}
function drawCubeAt(g, x, y, s, p, vx, vy, player) {
  const b = { x0: x, y0: y, x1: x + s, y1: y + s, pal: p, player, k: .3 };
  drawSides(g, b, vx, vy); drawFront(g, b);
}

const stars = Array.from({ length: 150 }, () => ({ x: Math.random(), y: Math.random(), s: .5 + Math.random() * 1.5, p: .04 + Math.random() * .2, tw: Math.random() * 6 }));

// ============================================================
//  遊戲狀態
// ============================================================
let state = 'menu', world, p, run = null, segPtr = 0, simTime = 0, acc = 0, stepCount = 0;
let parts = [], flash = 0, shake = 0, deathT = 0, clock = 0, lastScore = 0;
let debug = /[?&]debug/.test(location.search);
const cam = { x: 0 };

// ---------- 結算的貓咪照片：超過 CAT_WIN_SCORE 分抽 win/，否則抽 lose/ ----------
const CAT_WIN_SCORE = 80;
const catPool = w => (w ? (typeof WIN_CATS !== 'undefined' ? WIN_CATS : []) : (typeof LOSE_CATS !== 'undefined' ? LOSE_CATS : []));
let catPre = { win: null, lose: null };

// 開局就先把這局可能用到的兩張讀進來，結算時才不會等圖
function preloadCats() {
  for (const w of [true, false]) {
    const pool = catPool(w);
    if (!pool.length) { catPre[w ? 'win' : 'lose'] = null; continue; }
    const src = pool[Math.floor(Math.random() * pool.length)];
    const img = new Image();
    img.src = src;
    catPre[w ? 'win' : 'lose'] = src;
  }
}
function showCat(score) {
  const win = score > CAT_WIN_SCORE;
  const src = catPre[win ? 'win' : 'lose'] || (catPool(win)[0] || null);
  if (!src) return;                                   // 沒有照片就不彈
  const img = $('catImg');
  img.onerror = () => hideCat();                      // 圖檔不見就別顯示破圖
  img.src = src;
  $('catTitle').textContent = win ? `${score} 分！` : `${score} 分`;
  $('catTitle').className = 'catTitle ' + (win ? 'win' : 'lose');
  $('catSub').textContent = win ? `超過 ${CAT_WIN_SCORE} 分，貓貓給你拍拍手` : `再拼一次，貓貓在等你破 ${CAT_WIN_SCORE} 分`;
  $('catPop').classList.remove('hidden');
}
function hideCat() { $('catPop').classList.add('hidden'); }
const catOpen = () => !$('catPop').classList.contains('hidden');

// ---------- 指定關卡播放自己的音樂 ----------
// 關卡名稱 → 音檔（路徑相對於 index.html）。進入該關才播，離開或死亡就停，之後回到合成音樂
const LEVEL_BGM = {
  'x': 'cool.mp3',
};
function segBgm(seg) {
  if (!seg || !seg.name) return null;
  const name = seg.name.replace(/^★/, '').replace('（翻轉）', '');
  return LEVEL_BGM[name] || null;
}

// ---------- 單關模式：重複遊玩同一關、死亡自動重來、不計分也不影響存檔 ----------
//   練習：從主選單選一關（fromMenu = true，可用 Esc 或按鈕離開）
//   試玩：由地圖編輯器以 index.html#test=... 開啟
let FOCUS = null;

function focusFromHash() {
  const m = location.hash.match(/^#test=(.+)$/);
  if (!m) return null;
  try {
    const L = JSON.parse(decodeURIComponent(m[1]));
    const lv = parseLevel(L), d = clamp(L.d | 0, 1, 5), conn = levelConn(L);
    const cols = stdCols(conn).concat(lv.cols), path = validate(cols, d);
    return { name: L.name || '未命名', d, conn, cols, coins: lv.coins, path, valid: !!path,
      deaths: 0, passes: 0, fromMenu: false, label: '試玩' };
  } catch (e) { return null; }
}
// HANDMADE 的 cols 已經含開頭的銜接通道
function focusFromLevel(h) {
  return { name: h.name, d: h.d, conn: h.conn, cols: h.cols, coins: h.coins, path: h.path, valid: true,
    deaths: 0, passes: 0, fromMenu: true, label: '練習' };
}

function focusSegment() {
  const coins = FOCUS.coins.length ? FOCUS.coins.map(k => ({ x: k.x + FOCUS.conn, y: k.y }))
    : FOCUS.path ? placeCoins(FOCUS.path, FOCUS.cols.length, FOCUS.d, FOCUS.conn) : [];
  return { cols: FOCUS.cols, d: FOCUS.d, name: '★' + FOCUS.name, coins, requested: FOCUS.d };
}

function newWorld() {
  world = { cols: stdCols(RUN_START_X + 8), segs: [{ start: 0, len: RUN_START_X + 8, d: 0, name: 'intro' }], coins: [] };
}
function addSegment() {
  const start = world.cols.length;
  const score = Math.max(0, Math.floor((start - RUN_START_X) / CONFIG.COLS_PER_POINT));
  const seg = FOCUS ? focusSegment() : buildSegment(pickDifficulty(score));
  for (const c of seg.cols) world.cols.push(c);
  world.segs.push({ start, len: seg.cols.length, d: seg.d, name: seg.name, requested: seg.requested });
  for (const k of seg.coins) world.coins.push({ x: k.x + start, y: k.y, taken: false });
}
function ensureWorld(maxNew) {
  let n = 0;
  while (world.cols.length < cam.x + 28 && (n < maxNew || world.cols.length < cam.x + 15)) { addSegment(); n++; }
}
function solidAt(c, r) {
  const col = world.cols[c];
  if (!col) return 0;
  return col[r < 0 ? 0 : r >= ROWS ? ROWS - 1 : r];
}
function newPlayer() { return { x: RUN_START_X, y: F0 - P, s: P, vy: 0, g: 1, grounded: true, dead: false, justLanded: false, n: 0, buffer: -Infinity }; }

function startRun() {
  newWorld(); p = newPlayer(); cam.x = p.x - CAM_OFFSET;
  run = { score: 0, coins: 0, flips: 0, maxD: 0 };
  segPtr = 0; simTime = 0; acc = 0; stepCount = 0; parts = []; flash = 0; shake = 0;
  resetLandSeq(); paint.clear();
  ensureWorld(30);
  state = 'playing';
  if (!FOCUS) preloadCats();
  closePanels(); hideCat(); $('menu').classList.add('hidden');
  $('quitFocus').classList.toggle('hidden', !(FOCUS && FOCUS.fromMenu));
  Sound.unlock(); Sound.track(null); Sound.music(true);
}

function press() {
  Sound.unlock();   // 瀏覽器要求先有使用者操作才能發聲
  if (state !== 'playing') return;
  if (p.grounded) doFlip(); else p.buffer = simTime;   // 空中按下：記住一次，著地時立刻切換
}
function doFlip() {
  flipBody(p); run.flips++;
  const sy = p.g > 0 ? p.y : p.y + P;
  burst(p.x + P / 2, sy, 8, skinTrail(), 3, .35);
}

function simStep() {
  simTime += DT;
  stepBody(p, solidAt);
  if (p.dead) { die(); return; }
  if (p.grounded) paintUnderPlayer();   // 貼著地形跑就一路染色
  if (p.justLanded) {
    p.squash = 1;
    burst(p.x + P / 2, p.g > 0 ? p.y + P : p.y, 6, 'rgba(255,255,255,1)', 2, .25);
    Sound.land(p.g < 0, landStep());
    if (simTime - p.buffer <= CONFIG.BUFFER_TIME) { p.buffer = -Infinity; doFlip(); }   // 空中預輸入：著地立刻反彈
  }
  const cx = p.x + P / 2, cy = p.y + P / 2;
  for (const k of world.coins) {
    if (!k.taken && Math.abs(k.x - cx) < .62 && Math.abs(k.y - cy) < .62) {
      k.taken = true; run.coins++; burst(k.x, k.y, 14, '#fff46e', 4, .45); Sound.coin();
    }
  }
  run.score = Math.max(0, Math.floor((p.x - RUN_START_X) / CONFIG.COLS_PER_POINT));
  let segChanged = false;
  while (segPtr + 1 < world.segs.length && world.segs[segPtr + 1].start <= p.x + P) {
    segPtr++; segChanged = true;
    if (FOCUS && segPtr > 1) FOCUS.passes++;   // 單關模式：跨過一次關卡結尾 = 通過一次
  }
  if (segChanged) Sound.track(segBgm(world.segs[segPtr]));   // 進入 / 離開有指定音樂的關卡
  run.maxD = Math.max(run.maxD, world.segs[segPtr].d);
  if (++stepCount % 12 === 0 && !FOCUS) checkChallenges(false);
}

// ---------- 踩過的地形會被染成方塊的顏色 ----------
// key = "欄:區塊起始列"，所以染的是「踩到的那一段柱子」，不會連對面那段一起染
const paint = new Map();
function paintKey(c, row) {
  let r = row;
  while (r > 0 && solidAt(c, r - 1)) r--;     // 往回找這段連續實心的起點
  return c + ':' + r;
}
function paintUnderPlayer() {
  const row = p.g > 0 ? Math.floor(p.y + P + .02) : Math.floor(p.y - .02);
  const c0 = Math.floor(p.x + .02), c1 = Math.floor(p.x + P - .02);
  const col = skinPal(curSkin(), clock);       // 彩虹造型會隨時間變色，沿路就是一條漸層
  for (let c = c0; c <= c1; c++) if (solidAt(c, row)) paint.set(paintKey(c, row), col);
}

// 連續落地時的音階位置：同一側連著踩階梯才累積，往上一階升一階、往下一階降一階
const landSeq = { idx: 0, t: -9, surf: 0, g: 1 };
function resetLandSeq() { landSeq.idx = 0; landSeq.t = -9; }
function landStep() {
  const surf = p.g > 0 ? p.y + P : p.y;          // 接觸面的位置
  const rise = landSeq.surf - surf;              // 正 = 這次落點比上次高
  if (simTime - landSeq.t > 0.6 || p.g !== landSeq.g) landSeq.idx = 0;   // 隔太久或換邊就重來
  else if (Math.abs(rise) >= 0.5) {
    const stepN = Math.min(3, Math.round(Math.abs(rise)));
    landSeq.idx = clamp(landSeq.idx + (rise > 0 ? stepN : -stepN), -10, 10);
  }
  landSeq.t = simTime; landSeq.surf = surf; landSeq.g = p.g;
  return landSeq.idx;
}

function die() {
  state = 'dead'; deathT = 0; flash = 1; shake = 1;
  resetLandSeq();
  Sound.track(null);   // 死亡就停掉關卡音樂
  Sound.death();
  if (FOCUS) FOCUS.deaths++;
  const pl = skinPal(curSkin(), clock);
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 7;
    parts.push({ x: p.x + P / 2, y: p.y + P / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .9, max: .9,
      size: .12 + Math.random() * .2, color: i % 3 ? pl.front : '#ffffff', sq: true, add: false });
  }
}

function endRun() {
  save.games++; save.coinsTotal += run.coins; save.distTotal += run.score; save.coins += run.coins;
  const isBest = run.score > save.best;
  if (isBest) save.best = run.score;
  lastScore = run.score;
  checkChallenges(true);
  persist();
  state = 'menu';
  Sound.track(null); Sound.music(false);
  showMenu(isBest && run.score > 0);
  showCat(run.score);
}

// ---------- 粒子 ----------
function skinTrail() { const s = curSkin(); return s.rainbow ? `hsl(${(clock * 90 + 180) % 360},95%,60%)` : s.trail; }
function burst(x, y, n, color, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (.3 + Math.random() * .7);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, size: .08 + Math.random() * .12, color, add: true });
  }
}
function emitTrail(dt) {
  const n = Math.random() < dt * 70 ? 2 : 1;
  const col = skinTrail();
  for (let i = 0; i < n; i++) {
    parts.push({ x: p.x + .05, y: p.y + P * (.25 + Math.random() * .5), vx: -.5 - Math.random() * 1.2, vy: (Math.random() - .5) * 1.2 - p.g * .4,
      life: .5, max: .5, size: .16 + Math.random() * .18, color: col, add: true, grow: true });
  }
}
function updateParts(dt) {
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; if (q.sq) q.vy += 12 * dt; }
  parts = parts.filter(q => q.life > 0);
}

// ---------- 繪製 ----------
function render() {
  const sx = shake > 0 ? (Math.random() - .5) * shake * 16 : 0, sy = shake > 0 ? (Math.random() - .5) * shake * 16 : 0;
  ctx.save(); ctx.translate(sx, sy);
  ctx.fillStyle = '#070619'; ctx.fillRect(-30, -30, W + 60, H + 60);

  const span = W * 1.4;
  for (const s of stars) {
    const x = ((s.x * span - cam.x * CELL * s.p) % span + span) % span - W * .2;
    ctx.globalAlpha = .35 + .35 * Math.sin(clock * 2 + s.tw);
    ctx.fillStyle = '#b9c3ff'; ctx.fillRect(x, s.y * H, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  const boxes = [];
  const c0 = Math.floor(cam.x) - 3, c1 = Math.ceil(cam.x + W / CELL) + 4;
  for (let c = Math.max(0, c0); c <= c1; c++) {
    const col = world.cols[c]; if (!col) continue;
    const x0 = (c - cam.x) * CELL, x1 = x0 + CELL;
    let r = 0;
    while (r < ROWS) {
      if (!col[r]) { r++; continue; }
      let e = r; while (e + 1 < ROWS && col[e + 1]) e++;
      // 同一欄中連續的實心合併成一塊，中間不再有接縫；被踩過的用染上的顏色
      boxes.push({ x0, x1, y0: r === 0 ? -CELL * 8 : r * CELL, y1: e === ROWS - 1 ? H + CELL * 8 : (e + 1) * CELL,
        pal: paint.get(c + ':' + r) || colorFor(c) });
      r = e + 1;
    }
  }
  for (const k of world.coins) {
    if (k.taken || k.x < c0 || k.x > c1) continue;
    const s = .34 * CELL, x = (k.x - cam.x) * CELL - s / 2, y = (k.y + Math.sin(clock * 4 + k.x) * .12) * CELL - s / 2;
    boxes.push({ x0: x, x1: x + s, y0: y, y1: y + s, pal: COIN_PAL, glow: 'rgba(255,240,80,.9)', k: DEPTH * .3 });
  }
  if (state !== 'dead') {
    // 飛行時沿垂直方向拉長、著地瞬間壓扁，讓切換看起來更俐落
    const s = P * CELL, sk = curSkin();
    const st = p.grounded ? 0 : Math.min(1, Math.abs(p.vy) / CONFIG.MAX_FALL) * .32;
    const sq = p.squash || 0;
    const hgt = s * (1 + st - sq * .3), wid = s * (1 - st * .45 + sq * .25);
    const cx = (p.x - cam.x) * CELL + s / 2;
    let y0 = p.y * CELL + (s - hgt) / 2;
    if (p.grounded) y0 = p.g > 0 ? p.y * CELL + s - hgt : p.y * CELL;
    boxes.push({ x0: cx - wid / 2, x1: cx + wid / 2, y0, y1: y0 + hgt, pal: skinPal(sk, clock), player: sk, glow: 'rgba(255,255,255,.35)', k: DEPTH * .75 });
  }
  for (const b of boxes) {
    const dx = clamp((b.x0 + b.x1) / 2, -50, W + 50) - VPX, dy = clamp((b.y0 + b.y1) / 2, -50, H + 50) - VPY;
    b.d = dx * dx + dy * dy;
  }
  boxes.sort((a, b) => b.d - a.d);
  for (const b of boxes) drawSides(ctx, b, VPX, VPY);
  for (const b of boxes) drawFront(ctx, b);

  for (const q of parts) {
    const t = q.life / q.max, x = (q.x - cam.x) * CELL, y = q.y * CELL;
    ctx.globalCompositeOperation = q.add ? 'lighter' : 'source-over';
    ctx.globalAlpha = q.add ? t * .42 : Math.min(1, t * 1.5);
    ctx.fillStyle = q.color;
    const r = q.size * CELL * (q.grow ? (1.6 - t) : 1);
    if (q.sq) ctx.fillRect(x - r, y - r, r * 2, r * 2);
    else { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  let gr = ctx.createLinearGradient(0, 0, 0, H * .14);
  gr.addColorStop(0, 'rgba(7,6,25,.85)'); gr.addColorStop(1, 'rgba(7,6,25,0)');
  ctx.fillStyle = gr; ctx.fillRect(-30, -30, W + 60, H * .14 + 30);
  gr = ctx.createLinearGradient(0, H * .8, 0, H);
  gr.addColorStop(0, 'rgba(7,6,25,0)'); gr.addColorStop(1, 'rgba(7,6,25,.9)');
  ctx.fillStyle = gr; ctx.fillRect(-30, H * .8, W + 60, H * .2 + 30);

  if (debug) drawDebug();
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .85})`; ctx.fillRect(0, 0, W, H); }

  if (state !== 'menu' && !FOCUS) {   // 單關模式不計分，改用上方的狀態列
    ctx.font = '900 58px Orbitron, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff'; ctx.fillText(run.score, W / 2, 112);
    ctx.shadowBlur = 0;
  }
  if (FOCUS) {
    ctx.font = '600 14px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, 26);
    ctx.fillStyle = FOCUS.valid ? '#7dffb0' : '#ff7070';
    ctx.fillText(`${FOCUS.label}：${FOCUS.name}（D${FOCUS.d}）${FOCUS.valid ? '' : ' ⚠ 驗證未通過'}　通過 ${FOCUS.passes} 次　死亡 ${FOCUS.deaths} 次`, 8, 18);
  }
}

function drawDebug() {
  ctx.font = '600 13px system-ui, sans-serif'; ctx.textAlign = 'left';
  for (const s of world.segs) {
    const x = (s.start - cam.x) * CELL;
    if (x < -W || x > W * 2) continue;
    ctx.strokeStyle = 'rgba(255,255,0,.7)'; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ff0';
    const req = s.requested && s.requested !== s.d ? ` (要求 D${s.requested})` : '';
    ctx.fillText(`D${s.d} ${s.name}${req}`, x + 4, 150);
    ctx.fillText(`${(s.len / CONFIG.COLS_PER_POINT) | 0} 分`, x + 4, 166);
  }
  const sc = run ? run.score : 0;
  let row = CONFIG.DIFFICULTY_TABLE[0];
  for (const r of CONFIG.DIFFICULTY_TABLE) if (sc >= r.minScore) row = r;
  ctx.fillStyle = '#ff0';
  ctx.fillText(`分數 ${sc} → 權重 D1~D5: ${row.weights.join(' / ')}`, 10, H - 14);
}

// ---------- 主迴圈 ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  if (state === 'playing') {
    acc += dt;
    while (acc >= DT && state === 'playing') { simStep(); acc -= DT; }
    if (state === 'playing') {
      cam.x = p.x - CAM_OFFSET; emitTrail(dt); p.squash = Math.max(0, (p.squash || 0) - dt * 7);
      Sound.setIntensity(FOCUS ? (FOCUS.d - 1) / 4 : run.score / 150);   // 分數（或難度）越高，背景音越密
    }
  } else if (state === 'dead') {
    deathT += dt;
    if (FOCUS && deathT > .7) startRun();          // 單關模式：死亡後自動重來
    else if (!FOCUS && deathT > 1.1) endRun();
  }
  if (state !== 'menu') ensureWorld(1);
  updateParts(dt);
  flash = Math.max(0, flash - dt * 2.2); shake = Math.max(0, shake - dt * 3);
  $('coinTxt').textContent = save.coins + (run && state !== 'menu' && !FOCUS ? run.coins : 0);   // 單關模式不計分、不計方塊
  render();
  requestAnimationFrame(frame);
}

// ============================================================
//  介面
// ============================================================
const COIN_SVG = '<svg viewBox="0 0 20 20"><path d="M10 1l8 4-8 4-8-4z" fill="#fff46e"/><path d="M2 5l8 4v10l-8-4z" fill="#e3c800"/><path d="M18 5l-8 4v10l8-4z" fill="#b39a00"/></svg>';
let toastTimer = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function showMenu(isBest) {
  $('mScore').textContent = lastScore;
  $('mBest').textContent = save.best;
  $('newBest').textContent = isBest ? 'new best!' : '';
  const total = CHALLENGES.length;
  $('chTotal').textContent = total;
  if (save.ch >= total) {
    $('chNum').textContent = total; $('chDesc').textContent = 'all challenges completed';
  } else {
    const c = CHALLENGES[save.ch];
    $('chNum').textContent = save.ch + 1;
    $('chDesc').textContent = chDesc(c) + (CUMULATIVE[c.t] ? `（${Math.min(chProgress(c, true), c.n)}/${c.n}）` : '');
  }
  $('achPct').textContent = (Math.floor(save.ch / total * 1000) / 10) + '%';
  $('menu').classList.remove('hidden');
}

const PANELS = ['shop', 'ach', 'practice'];
function closePanels() { PANELS.forEach(id => $(id).classList.add('hidden')); }
function panelOpen() { return PANELS.some(id => !$(id).classList.contains('hidden')); }

function renderShop() {
  const grid = $('shopGrid'); grid.innerHTML = '';
  for (const s of SKINS) {
    const owned = save.owned.includes(s.id), sel = save.skin === s.id;
    const card = document.createElement('button');
    card.className = 'skin' + (sel ? ' sel' : '');
    const pc = document.createElement('canvas'); pc.width = 120; pc.height = 120;
    const g = pc.getContext('2d');
    drawCubeAt(g, 26, 34, 60, s.rainbow ? hslPal(300) : pal(s.body), 90, 10, s);
    card.appendChild(pc);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = s.name; card.appendChild(nm);
    const pr = document.createElement('div');
    if (sel) { pr.className = 'pr no'; pr.textContent = '使用中'; }
    else if (owned) { pr.className = 'pr'; pr.textContent = '使用'; }
    else { pr.className = 'pr' + (save.coins < s.price ? ' no' : ''); pr.innerHTML = s.price + COIN_SVG; }
    card.appendChild(pr);
    card.onclick = () => {
      if (owned) { save.skin = s.id; }
      else if (save.coins >= s.price) { save.coins -= s.price; save.owned.push(s.id); save.skin = s.id; toast(`解鎖「${s.name}」`); }
      else { toast(`黃色方塊不足（還差 ${s.price - save.coins}）`); return; }
      persist(); renderShop();
    };
    grid.appendChild(card);
  }
}

function renderAch() {
  const list = $('achList'); list.innerHTML = '';
  CHALLENGES.forEach((c, i) => {
    const li = document.createElement('li');
    const done = i < save.ch, cur = i === save.ch;
    li.className = done ? 'done' : cur ? 'cur' : 'lock';
    let txt = chDesc(c);
    if (cur && CUMULATIVE[c.t]) txt += `（${Math.min(chProgress(c, true), c.n)}/${c.n}）`;
    li.innerHTML = `<span class="st">${done ? '✓' : i + 1}</span><span></span><span class="rw">+${c.r}${COIN_SVG}</span>`;
    li.children[1].textContent = txt;
    list.appendChild(li);
  });
}

// ---------- 練習模式：依難度列出所有手工關卡 ----------
function renderPractice() {
  if (!HANDMADE) prepareHandmade();
  const box = $('practiceList'); box.innerHTML = '';
  for (let d = 1; d <= 5; d++) {
    const pool = HANDMADE.filter(h => h.d === d);
    const g = document.createElement('div');
    g.className = 'pGroup';
    g.innerHTML = `<h3>難度 ${d} <span>${pool.length} 關</span></h3>`;
    if (!pool.length) {
      const e = document.createElement('div');
      e.className = 'pEmpty'; e.textContent = '（還沒有這個難度的關卡）';
      g.appendChild(e);
    }
    for (const h of pool) {
      const b = document.createElement('button');
      b.className = 'pItem';
      const cols = h.cols.length - h.conn;
      b.innerHTML = `<span></span><span class="mi">${cols} 格 · ${(cols / CONFIG.COLS_PER_POINT).toFixed(1)} 分</span>`;
      b.children[0].textContent = h.name;
      b.onclick = () => startPractice(h);
      g.appendChild(b);
    }
    box.appendChild(g);
  }
}
function startPractice(h) {
  FOCUS = focusFromLevel(h);
  startRun();
}
function quitFocus() {
  FOCUS = null;
  Sound.track(null); Sound.music(false);
  $('quitFocus').classList.add('hidden');
  newWorld(); p = newPlayer(); cam.x = p.x - CAM_OFFSET; parts = []; flash = 0; shake = 0;
  ensureWorld(30);
  state = 'menu';
  showMenu(false);
}

$('play').onclick = e => { e.stopPropagation(); FOCUS = null; startRun(); };
$('btnShop').onclick = () => { renderShop(); $('shop').classList.remove('hidden'); };
$('btnAch').onclick = () => { renderAch(); $('ach').classList.remove('hidden'); };
$('btnPractice').onclick = () => { renderPractice(); $('practice').classList.remove('hidden'); };
$('quitFocus').onclick = quitFocus;
$('catPop').onclick = hideCat;   // 點任何地方關掉貓咪

function syncMute() { $('btnMute').textContent = Sound.isMuted() ? '🔇' : '🔊'; }
$('btnMute').onclick = e => { e.stopPropagation(); Sound.unlock(); Sound.toggleMute(); syncMute(); };
syncMute();
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closePanels);

cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (catOpen()) hideCat();                        // 貓咪還開著，先關掉而不是直接開新局
    else if (state === 'playing') press();
    else if (state === 'menu' && !panelOpen()) startRun();
  } else if (e.code === 'Escape') {
    if (catOpen()) hideCat();
    else if (FOCUS && FOCUS.fromMenu && state !== 'menu') quitFocus();
    else closePanels();
  } else if (e.code === 'KeyM') { Sound.unlock(); Sound.toggleMute(); syncMute(); }
  else if (e.code === 'KeyD') debug = !debug;
});

// 初始畫面：主選單背後放一段關卡
FOCUS = focusFromHash();
if (FOCUS) { debug = true; addEventListener('hashchange', () => location.reload()); }
newWorld(); p = newPlayer(); cam.x = p.x - CAM_OFFSET; ensureWorld(30);
if (FOCUS) startRun(); else showMenu(false);
requestAnimationFrame(frame);
</script>
